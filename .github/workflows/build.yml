name: Build BossFight Jar

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: JDK 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Derle
        run: mvn -B clean package

      - name: Jar yukle
        uses: actions/upload-artifact@v4
        with:
          name: BossFight
          path: target/BossFight.jar
          if-no-files-found: error
